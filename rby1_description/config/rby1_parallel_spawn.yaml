# RBY1 Isaac Sim spawn configuration.
# Revolute joint positions are in radians; prismatic positions are in meters.

usd_path: ../usd/rby1a/model_v1_2.usd
usd_prim_path: /RBY1_A_v1_2
prim_path: /World/rby1

scene:
  ground:
    enabled: true
    prim_path: /World/ground
    size: [10.0, 10.0]
    color: [0.25, 0.25, 0.25]

  # The robot's forward direction is assumed to be +X.
  # A solid static cuboid is used as a simple table; its top is at z=0.75 m.
  table:
    enabled: true
    prim_path: /World/table
    position: [0.8, 0.0, 0.375]
    size: [0.6, 1.2, 0.75]
    color: [0.45, 0.25, 0.10]

initial_joint_positions:
  torso_0: 0.0
  torso_1: 0.0
  torso_2: 0.0
  torso_3: 0.0
  torso_4: 0.0
  torso_5: 0.0
  right_arm_0: 0.0
  right_arm_1: 0.0
  right_arm_2: 0.0
  right_arm_3: 0.0
  right_arm_4: 0.0
  right_arm_5: 0.0
  right_arm_6: 0.0
  left_arm_0: 0.0
  left_arm_1: 0.0
  left_arm_2: 0.0
  left_arm_3: 0.0
  left_arm_4: 0.0
  left_arm_5: 0.0
  left_arm_6: 0.0
  head_0: 0.0
  head_1: 0.78539816339
  gripper_finger_r1_joint: 0.0
  gripper_finger_l1_joint: 0.0

joint_drive:
  # Applied to every independent revolute/prismatic joint unless overridden.
  default:
    max_force: 10.0
    stiffness: 100.0
    damping: 10.0

  # Overrides use exact USD/URDF joint names. Mimic follower joints r2/l2
  # intentionally have no independent drive.
  overrides:
    torso_0: { max_force: 270.0, stiffness: 1000.0, damping: 100.0 }
    torso_1: { max_force: 270.0, stiffness: 1000.0, damping: 100.0 }
    torso_2: { max_force: 270.0, stiffness: 1000.0, damping: 100.0 }
    torso_3: { max_force: 120.0, stiffness: 800.0, damping: 80.0 }
    torso_4: { max_force: 120.0, stiffness: 800.0, damping: 80.0 }
    torso_5: { max_force: 120.0, stiffness: 800.0, damping: 80.0 }

    right_arm_0: { max_force: 70.0, stiffness: 400.0, damping: 40.0 }
    right_arm_1: { max_force: 70.0, stiffness: 400.0, damping: 40.0 }
    right_arm_2: { max_force: 70.0, stiffness: 400.0, damping: 40.0 }
    right_arm_3: { max_force: 40.0, stiffness: 250.0, damping: 25.0 }
    right_arm_4: { max_force: 10.0, stiffness: 100.0, damping: 10.0 }
    right_arm_5: { max_force: 10.0, stiffness: 100.0, damping: 10.0 }
    right_arm_6: { max_force: 8.0, stiffness: 80.0, damping: 8.0 }

    left_arm_0: { max_force: 70.0, stiffness: 400.0, damping: 40.0 }
    left_arm_1: { max_force: 70.0, stiffness: 400.0, damping: 40.0 }
    left_arm_2: { max_force: 70.0, stiffness: 400.0, damping: 40.0 }
    left_arm_3: { max_force: 40.0, stiffness: 250.0, damping: 25.0 }
    left_arm_4: { max_force: 10.0, stiffness: 100.0, damping: 10.0 }
    left_arm_5: { max_force: 10.0, stiffness: 100.0, damping: 10.0 }
    left_arm_6: { max_force: 8.0, stiffness: 80.0, damping: 8.0 }

    gripper_finger_r1_joint:
      max_force: 100.0
      stiffness: 5000.0
      damping: 200.0
    gripper_finger_l1_joint:
      max_force: 100.0
      stiffness: 5000.0
      damping: 200.0
